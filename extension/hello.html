<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revise DSA</title>
    <link rel="stylesheet" href="popup.css" />
</head>

<body>

    <div class="container">

        <div class="header">
            <div>
                <h1>Revise DSA</h1>
                <p>Track. Revise. Master.</p>
            </div>
        </div>

        <form id="dsaForm">

            <!-- Problem Name -->
            <div class="form-group">
                <label for="name">Problem Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Detecting..."
                    readonly
                />
            </div>

            <!-- Problem URL -->
            <div class="form-group">
                <label for="url">Problem URL</label>
                <input
                    type="url"
                    id="url"
                    name="url"
                    placeholder="Detecting..."
                    readonly
                />
            </div>

            <!-- Platform + Difficulty -->
            <div class="form-row">

                <div class="form-group">
                    <label for="platform">Platform</label>

                    <select id="platform" name="platform" disabled>
                        <option value="">Detecting...</option>
                        <option value="LeetCode">LeetCode</option>
                        <option value="GeeksforGeeks">GeeksforGeeks</option>
                        <option value="Codeforces">Codeforces</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty</label>

                    <select id="difficulty" name="difficulty" disabled>
                        <option value="">Detecting...</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>

            </div>

            <!-- User Difficulty -->
            <div class="form-group">
                <label for="userdiff">Your Difficulty</label>

                <select id="userdiff" name="userdiff">
                    <option value="">How difficult was it?</option>
                    <option value="Very Easy">Very Easy</option>
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                    <option value="Very Hard">Very Hard</option>
                </select>
            </div>

            <!-- Remark -->
            <div class="form-group">
                <label for="remark">Remark</label>

                <textarea
                    id="remark"
                    name="remark"
                    rows="3"
                    placeholder="What did you learn from this problem?"
                ></textarea>
            </div>

            <!-- Solved Remark -->
            <div class="form-group">
                <label for="solvedRemark">Solved Remark</label>

                <textarea
                    id="solvedRemark"
                    name="solvedRemark"
                    rows="3"
                    placeholder="Write your solution/revision note..."
                ></textarea>
            </div>

            <button type="submit" id="addToSheet">
                Add
            </button>

        </form>

    </div>

    <script src="popup.js"></script>

</body>
</html>
