<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revise DSA</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div>
          <h1>Revise DSA</h1>
          <p>Track. Revise. Master.</p>
        </div>
      </div>

      <form id="dsaForm">
        <!-- Problem Name -->
        <div class="form-group">
          <label for="name">Problem Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Detecting..."
            readonly
          />
        </div>

        <!-- Problem URL -->
        <div class="form-group">
          <label for="url">Problem URL</label>
          <input
            type="url"
            id="url"
            name="url"
            placeholder="Detecting..."
            readonly
          />
        </div>

        <!-- Platform + Difficulty -->
        <div class="form-row">
          <div class="form-group">
            <label for="platform">Platform</label>
            <input id="platform" type="text" value="Detecting..." disabled />
          </div>

          <div class="form-group">
            <label for="difficulty">Difficulty</label>
            <input id="difficulty" type="text" value="Detecting..." disabled />
          </div>
        </div>

        <!-- User Difficulty -->
        <div class="form-group">
          <label for="userdiff">Your Difficulty</label>

          <select id="userdiff" name="userdiff">
            <option value="">How difficult was it?</option>
            <option value="Very Easy">Very Easy</option>
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
            <option value="Very Hard">Very Hard</option>
          </select>
        </div>

        <!-- Remark -->
        <div class="form-group">
          <label for="remark">Remark</label>

          <textarea
            id="remark"
            name="remark"
            rows="3"
            placeholder="What did you learn from this problem?"
          ></textarea>
        </div>

        <!-- Solved Remark -->
        <div class="form-group">
          <label for="solved-review">
            How did you solve it?
            <span class="hint">(affects revision priority)</span>
          </label>

          <select id="solved-review" name="solved_review" required>
            <option value="" disabled selected>
              Select closest option
            </option>

            <option value="instantly_solved">Instantly solved</option>
            <option value="solved_comfortably">Solved comfortably</option>
            <option value="solved_but_struggled">Solved but struggled</option>
            <option value="brute_force_optimization_needed">
              Brute force solved, optimization needed help
            </option>
            <option value="brute_force_couldnt_optimize">
              Brute force solved, couldn't optimize
            </option>
            <option value="solved_with_hint">Solved with a hint</option>
            <option value="solved_with_ai">Solved with AI assistance</option>
            <option value="solved_with_tutorial">
              Solved with tutorial/explanation
            </option>
            <option value="couldnt_solve">Couldn't solve</option>
          </select>
        </div>

        <button type="submit" id="addToSheet">Add to ReviseDsa</button>
      </form>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
